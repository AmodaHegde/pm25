stages:
  cross_validate:
    cmd: python src/models/baseline_pinn.py
    deps:
      - data/silver/delhi_air_weather.csv
    params:
      - seed
      - cv.n_splits
      - training.epochs
      - training.learning_rate
      - training.physics_weight
      - training.data_weight
    metrics:
      - results/pinn_timeseries_cv_metrics.json
    outs:
      - outputs/pinn_timeseries_cv_predictions.csv