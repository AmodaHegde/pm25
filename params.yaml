lstm:
  data:
    dataset_path: data/silver/pm25-1.csv
    train_split: 0.7
    val_split: 0.15
    test_split: 0.15
    lookback_window: 24
    target_column: pm2_5
  model:
    hidden_dim: 256
    num_layers: 1
    dropout: 0.30000000000000004
    save_path: models/lstm_model.pth
    scaler_path: models/scaler.pkl
  train:
    batch_size: 16
    learning_rate: 0.0004107732089297195
    epochs: 50
  mlflow:
    experiment_name: LSTM_Baseline
  tuning_epochs: 10
transformer:
  data:
    dataset_path: data/silver/pm25-1.csv
    train_split: 0.85
    lookback_window: 24
    target_column: pm2_5
  model:
    d_model: 64
    nhead: 4
    num_layers: 2 
    dropout: 0.2
    save_path: models/transformer_model.pth
  train:
    batch_size: 32
    learning_rate: 0.001
    epochs: 50
  mlflow:
    experiment_name: TRANS_Baseline
